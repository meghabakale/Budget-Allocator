services:
  - type: web
    name: budgetflow-api-server
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm run start --workspace=@workspace/api-server
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
